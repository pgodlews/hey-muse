name: Build & Release

# Every push and pull request: Go core tests + an APK artifact.
# Push to main:  signed release APK, republished as the rolling "latest" pre-release.
# Tag vX.Y.Z:    signed release APK published as a GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.3.13750724
      KEYSTORE_BASE64: ${{ secrets.HEYMUSE_KEYSTORE_BASE64 }}
      # Job-wide: once HEYMUSE_KEYSTORE_PATH is set, every Gradle invocation needs the full signing config.
      HEYMUSE_KEYSTORE_PASSWORD: ${{ secrets.HEYMUSE_KEYSTORE_PASSWORD }}
      HEYMUSE_KEY_ALIAS: ${{ secrets.HEYMUSE_KEY_ALIAS }}
      HEYMUSE_KEY_PASSWORD: ${{ secrets.HEYMUSE_KEY_PASSWORD }}
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Check out (full history and tags for versioning)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android platform, NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Compute version
        run: |
          scripts/version.sh | tee -a "$GITHUB_ENV"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          if [ "v$HEYMUSE_VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Computed version $HEYMUSE_VERSION_NAME does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Require signing secrets for published builds
        if: env.PUBLISH == 'true'
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing HEYMUSE_KEYSTORE_BASE64"
          [ -n "$HEYMUSE_KEYSTORE_PASSWORD" ] || missing="$missing HEYMUSE_KEYSTORE_PASSWORD"
          [ -n "$HEYMUSE_KEY_ALIAS" ] || missing="$missing HEYMUSE_KEY_ALIAS"
          [ -n "$HEYMUSE_KEY_PASSWORD" ] || missing="$missing HEYMUSE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing; refusing to publish an unsigned build."
            exit 1
          fi

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HEYMUSE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Go core tests
        working-directory: core
        run: |
          go vet ./...
          go test -race ./...

      - name: Build APK
        run: |
          mkdir -p dist
          if [ -n "${HEYMUSE_KEYSTORE_PATH:-}" ]; then
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/hey-muse.apk
          else
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/hey-muse.apk
          fi
          (cd dist && sha256sum hey-muse.apk > hey-muse.apk.sha256)
          cat dist/hey-muse.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hey-muse-${{ env.HEYMUSE_VERSION_NAME }}
          path: dist/hey-muse.apk*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/hey-muse.apk dist/hey-muse.apk.sha256 \
            --verify-tag --generate-notes \
            --title "Hey Muse $GITHUB_REF_NAME"

      - name: Publish rolling latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" > /dev/null 2>&1 || true
          gh release create latest dist/hey-muse.apk dist/hey-muse.apk.sha256 \
            --prerelease --target "$GITHUB_SHA" \
            --title "Hey Muse (latest main build)" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7} (version $HEYMUSE_VERSION_NAME). For a stable build, use the newest vX.Y.Z release."
